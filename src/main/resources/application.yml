spring:
  application:
    name: api-gateway
  config:
    import:
    - optional:file:.env[.properties]
    - 'classpath:web.yml'
    - 'classpath:eureka.yml'
    - 'classpath:swagger.yml'
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**

        - id: customer-service-route
          uri: lb://CUSTOMER-SERVICE
          predicates:
            - Path=/api/customer/**
logging:
  level:
    root: debug
